# Builds the Windows installer and portable zip on a Windows runner and
# attaches them to the GitHub release for the given tag.
# Run it from the Actions tab, or: gh workflow run release.yml -f tag=v2.2.0
name: Release Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to (e.g. v2.2.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer and zip
        run: npx electron-builder --win --x64 --publish never

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.exe dist/*.zip --clobber
