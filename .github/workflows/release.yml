# Builds the Windows installer and portable zip on a Windows runner and
# attaches them to the GitHub release for the given tag.
# Run it from the Actions tab, or: gh workflow run release.yml -f tag=v2.2.0
name: Release Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to (e.g. v2.2.0)
        required: true

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check out the packaging helper from this workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: build/release-automation
          sparse-checkout: scripts/package-windows-ci.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build installer and zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/release-automation/scripts/package-windows-ci.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          shopt -s failglob
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" dist/*.exe dist/*.zip
